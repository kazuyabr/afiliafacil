services:
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-afiliafacil}
      - POSTGRES_USER=${POSTGRES_USER:-afiliafacil}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-afiliafacil}"]
      interval: 5s
      timeout: 5s
      retries: 10
    container_name: afiliafacil-db

  app:
    build: .
    ports:
      - "9876:9876"
    volumes:
      - ./data:/app/data
      - ./pages:/app/pages
      - ./uploads:/app/uploads
    env_file:
      - .env
    environment:
      - DOCKER=true
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=${POSTGRES_DB:-afiliafacil}
      # Runtime usa a role restrita (criada pelo bin/migrate.php, sem DDL)
      - DB_USERNAME=${DB_APP_USER:-change-me}
      - DB_PASSWORD=${DB_APP_PASSWORD}
      # Migracoes usam o owner
      - DB_MIGRATION_USER=${POSTGRES_USER:-afiliafacil}
      - DB_MIGRATION_PASSWORD=${POSTGRES_PASSWORD}
      - DB_APP_USER=${DB_APP_USER:-change-me}
      - DB_APP_PASSWORD=${DB_APP_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    container_name: afiliafacil

volumes:
  db_data:

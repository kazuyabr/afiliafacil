services:
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=afiliafacil
      - POSTGRES_USER=afiliafacil
      - POSTGRES_PASSWORD=change-me
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U afiliafacil"]
      interval: 5s
      timeout: 5s
      retries: 10
    container_name: afiliafacil-db

  app:
    build: .
    ports:
      - "9876:9876"
    volumes:
      - ./data:/app/data
      - ./pages:/app/pages
      - ./uploads:/app/uploads
    env_file:
      - .env
    environment:
      - DOCKER=true
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=afiliafacil
      - DB_USERNAME=afiliafacil
      - DB_PASSWORD=change-me
    depends_on:
      db:
        condition: service_healthy
    container_name: afiliafacil

volumes:
  db_data:
